[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "frasq"
version = "0.1.0"
description = "A tiny declarative framework for RabbitMQ in Python, inspired by Flask and FastAPI."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Pedro Lucas Dall' Igna", email = "pedro.lucas-di@hotmail.com" }
]
dependencies = [
    "pika>=1.3.0",
    "python-dotenv>=1.0.0"
]

[pyproject.optional-dependencies]
dev = [
    "wheel",
    "build"
]
